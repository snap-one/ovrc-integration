name: Deploy static content to Pages

on:
  push:
    branches:
      - "main"
    paths:
      - "docs/pages/**"
      - "schemas/**"
  workflow_run:
    workflows: ["NPM Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # A failed or cancelled release published nothing to document.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # No ref: the default branch's tip is wanted. Do not "fix" this to
        # workflow_run.head_sha - that is the commit the release started from,
        # which predates both its version bumps and its typedoc commit.
      - uses: cargo-bins/cargo-binstall@main
        with:
          version: "1.23.0"
      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          working_directory: docs/pages
      - name: Build
        run: cd docs/pages && mise build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/pages/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
