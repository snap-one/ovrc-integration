name: NPM Release
concurrency: npm-release-${{ github.ref }}
on:
  push:
    tags-ignore:
      - "**"
    branches:
      - main
    paths:
      - "sdks/typescript/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the version commit and tag
      packages: write # publish to GitHub Packages
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }}"
      - name: Authenticate git pushes
        # persist-credentials is off, so put the app token on the remote for the
        # rc tags. semantic-release builds its own authenticated URL regardless.
        run: git remote set-url origin "https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/${{ github.repository }}.git"
      - name: Configure registry authentication
        # npm expands the ${...} at read time, so the tokens stay out of the file.
        run: |
          cat > "$HOME/.npmrc" <<'NPMRC_EOF'
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          always-auth=true
          NPMRC_EOF
      - name: Release
        run: mise run //sdks:ts-release
        env:
          GIT_AUTHOR_NAME: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_LOGIN }}
          GIT_AUTHOR_EMAIL: "${{ secrets.SNPO_SEMANTIC_RELEASE_APP_INSTALLATION_ID }}+${{ secrets.SNPO_SEMANTIC_RELEASE_APP_LOGIN }}@users.noreply.github.com"
          GIT_COMMITTER_NAME: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_LOGIN }}
          GIT_COMMITTER_EMAIL: "${{ secrets.SNPO_SEMANTIC_RELEASE_APP_INSTALLATION_ID }}+${{ secrets.SNPO_SEMANTIC_RELEASE_APP_LOGIN }}@users.noreply.github.com"
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          BASE_SHA: ${{ github.event.before }} # rc builds diff against the push base
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub Packages
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # npmjs.org
