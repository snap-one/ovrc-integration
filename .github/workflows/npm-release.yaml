name: NPM Release
concurrency:
  # Never cancelled: a run publishes to a registry and pushes tags, so
  # interrupting one leaves the registry ahead of git.
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    tags-ignore:
      - "**"
    branches:
      - main
    paths:
      - "sdks/typescript/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Optional: release only these packages, e.g. sdks/typescript/ovrc-integration-{camera,display}. Leave empty to release whatever the conventional commits since each package's last release call for."
        required: false
        type: string
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release pushes the version commit and tag
      id-token: write # SLSA provenance
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }}"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the full history and tags
          token: ${{ steps.generate_token.outputs.token }}
          # Default is true, but stated because this is what authenticates
          # semantic-release's version commit. Stored as an http.extraheader
          # that checkout strips again in its post step.
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Configure registry authentication
        # npm expands the ${...} at read time, so the token stays out of the file.
        run: |
          cat > "$HOME/.npmrc" <<'NPMRC_EOF'
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          NPMRC_EOF
      - name: Release
        run: mise run //sdks:ts-release
        env:
          GIT_AUTHOR_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: "${{ steps.generate_token.outputs.installation-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: ${{ steps.generate_token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: "${{ steps.generate_token.outputs.installation-id }}+${{ steps.generate_token.outputs.app-slug }}[bot]@users.noreply.github.com"
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }} # fallback if extraheader auth fails
          PACKAGES: ${{ inputs.packages }} # empty on push, so semantic-release decides
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # npmjs.org
          REPO_VISIBILITY: ${{ github.event.repository.visibility }} # provenance needs "public"
