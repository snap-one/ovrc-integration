name: NPM Release Candidate
concurrency: npm-release-${{ github.ref }}
on:
  push:
    tags-ignore:
      - "**"
    branches:
      - release-candidate
    paths:
      - "sdks/typescript/**"
  workflow_dispatch:
    inputs:
      packages:
        description: "Optional: release only these packages, e.g. sdks/typescript/ovrc-integration-{camera,display}. Leave empty to release whatever the last push changed."
        required: false
        type: string
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the rc tag is pushed back
      packages: write # publish to GitHub Packages
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SNPO_SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "${{ github.event.repository.name }}"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # rc numbering reads the release and rc tags out of the local clone.
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
          # Default is true, but stated because this is what authenticates the
          # rc tag push. Stored as an http.extraheader that checkout strips
          # again in its post step.
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Configure registry authentication
        # npm expands the ${...} at read time, so the token stays out of the file.
        run: |
          cat > "$HOME/.npmrc" <<'NPMRC_EOF'
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC_EOF
      - name: Release
        run: mise run //sdks:ts-release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }} # fallback if extraheader auth fails
          BASE_SHA: ${{ github.event.before }} # rc builds diff against the push base
          PACKAGES: ${{ inputs.packages }} # empty on push, so change detection applies
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub Packages
