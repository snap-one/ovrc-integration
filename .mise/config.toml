# Allows tasks to live close to their respective code.
monorepo_root = true

[settings]
# Necessary for several features used in this config.
experimental = true

[monorepo]
# Locations that contain mise configs.
config_roots = [
	"sdks",
]

[tasks.generate]
description = "Create or update all code generated artifacts"
depends = [
	"//sdks:ts-generate",
]

[tasks.test]
description = "Execute all tests within the repository"
depends = [
	"//sdks:ts-test",
]

[tools]
bun = "1"

